<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

    <!-- Tianao Xiong - CSCE 242 - Assignment 7 -->

    <div id="page">

        <header>
            <h1>Assignment 7</h1>

        </header>

        <main class="columns">

            <!-- Speech -->
            <section class="box" id="speech-section">
                <h3>Speech</h3>

                <div id="speech-bubble" class="hidden">
                    Hi
                </div>
            </section>

            <!-- Beverage -->
            <section class="box">
                <h3>Beverage</h3>

                <div class="drink-row">
                    <label for="beverage">
                        Pick your morning beverage:
                    </label>

                    <select id="beverage">
                        <option value="">Choose a Drink</option>
                        <option value="Coffee">Coffee</option>
                        <option value="Tea">Tea</option>
                        <option value="Orange Juice">Orange Juice</option>
                        <option value="Water">Water</option>
                    </select>
                </div>

                <p id="beverage-message"></p>
            </section>

            <!-- Sticker -->
            <section class="box sticker-box">
                <h3>Add a Sticker</h3>

                <div id="sticker-area">
                    <div id="sun">☀️</div>
                </div>
            </section>

        </main>

        <footer>
            <p>@tianao</p>
        </footer>

    </div>

    <script src="script.js"></script>
